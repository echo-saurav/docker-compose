
services:
  navidrome:
    image: deluan/navidrome:0.64.2
    container_name: navidrome
    user: ${UID}:${GID}
    ports:
      - 4533:4533
    networks:
      - traefik-net
    environment:
      ND_BASEURL: /navmusic
      ND_LOGLEVEL: debug
      ND_PLUGINS_ENABLED: true
      ND_PLUGINS_AUTORELOAD: true
      ND_ENABLEINSIGHTSCOLLECTOR: false
      ND_AUTOTRANSCODEDOWNLOAD: true
      ND_DEFAULTTHEME: Spotify-ish
      ND_ENABLEGRAVATAR: true
      ND_ENABLETRANSCODINGCONFIG: true
      ND_SCANNER_SCHEDULE: "0 * * * *"
      ND_LYRICSPRIORITY: .lrc,.ttml,.yaml,.yml,.elrc,.srt,.txt,embedded
      ND_AGENTS: audiomuseai,mood-playlists,lastfm,listenbrainz
      ND_LASTFM_APIKEY: ${LAST_FM_API_KEY}
      ND_LASTFM_SECRET: ${LAST_FM_SECRET}
    volumes:
      - ./data/navi:/data
      - ~/Public/Media/Music:/music
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # duck dns
      # https
      - "traefik.http.routers.nav.rule=Host(`${DUCK_BASE}`) && PathPrefix(`/navmusic`)"
      - "traefik.http.routers.nav.entrypoints=websecure"
      - "traefik.http.services.nav.loadbalancer.server.port=4533"
      - 'traefik.http.routers.nav.tls=true'
      - "traefik.http.routers.nav.tls.certresolver=myresolver"
      # http
      - "traefik.http.routers.nav-insecure.rule=Host(`${DUCK_BASE}`) && PathPrefix(`/navmusic`)"
      - "traefik.http.routers.nav-insecure.entrypoints=web"
      # dynacat
      - "dynacat.name=Navidrome"
      - "dynacat.icon=sh:navidrome"
      - "dynacat.url=https://${DUCK_BASE}/navmusic"
      - "dynacat.description=music"
      - "dynacat.category=primary"
      - "dynacat.id=navidrome"
      - "dynacat.hide=false"
      - "dynacat.same-tab=true"


  yubal:
    image: ghcr.io/guillevc/yubal:0.10.0
    container_name: yubal
    networks:
      - traefik-net
    ports:
      - 8777:8000
    environment:
      PUID: ${UID}
      PGID: ${GID}
      YUBAL_SCHEDULER_CRON: "0 0 * * *"
      YUBAL_DOWNLOAD_UGC: true
      YUBAL_TZ: ${TZ}
      YUBAL_REPLAYGAIN: false
    volumes:
      - ~/Public/Media/Music:/app/data
      - ./data/yubal:/app/config
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # https
      - "traefik.http.routers.yubal.rule=host(`download-music.home.arpa`)"
      - "traefik.http.routers.yubal.entrypoints=websecure"
      - "traefik.http.routers.yubal.tls=true"
      - "traefik.http.services.yubal.loadbalancer.server.port=8000"
      # http
      - "traefik.http.routers.yubal-insecure.rule=host(`download-music.home.arpa`)"
      - "traefik.http.routers.yubal-insecure.entrypoints=web"
      # dynacat
      - "dynacat.name=Yubal"
      - "dynacat.icon=di:nextcloud-ncdownloader"
      - "dynacat.url=https://download-music.home.arpa"
      - "dynacat.description=download music to navidrome"
      - "dynacat.category=tools"
      - "dynacat.id=yubal"
      - "dynacat.hide=false"
      - "dynacat.same-tab=true"


networks:
  traefik-net:
    external: true
    name: traefik-net

