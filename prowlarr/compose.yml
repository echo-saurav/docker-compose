
services:
  prowlarr:
    image: linuxserver/prowlarr:2.7.0
    container_name: prowlarr
    restart: unless-stopped
    networks:
      - traefik-net
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=${TZ}
    volumes:
      - ./data/prowlarr:/config
    ports:
      - 9697:9696
    labels:
      - "traefik.enable=true"
      # https
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.home.arpa`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - 'traefik.http.routers.prowlarr.tls=true' 
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      # http
      - "traefik.http.routers.prowlarr-insecure.rule=Host(`prowlarr.home.arpa`)"
      - "traefik.http.routers.prowlarr-insecure.entrypoints=web"
      # dynacat
      - "dynacat.name=Prowlarr"
      - "dynacat.icon=sh:prowlarr"
      - "dynacat.url=https://prowlarr.home.arpa"
      - "dynacat.description=prowlarr"
      - "dynacat.category=arr"
      - "dynacat.id=prowlarr"
      - "dynacat.hide=false"
      - "dynacat.same-tab=true"

  # removed flaresolverr because it use way too much cpu but not really useful to me 
  # flaresolverr:
