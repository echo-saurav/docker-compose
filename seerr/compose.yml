
services:
  # had to change ownership: chown -R 1000:1000 /data
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.1
    container_name: seerr
    restart: unless-stopped
    user: ${UID}:${GID}
    init: true
    networks:
      - traefik-net
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    ports:
      - 5058:5055
    volumes:
      - ./data/seerr:/app/config
    labels:
      - traefik.enable=true
      # https
      - "traefik.http.routers.jellyseerr-stable.rule=Host(`seerr.home.arpa`)"
      - "traefik.http.routers.jellyseerr-stable.entrypoints=websecure"
      - "traefik.http.routers.jellyseerr-stable.tls=true"
      # http
      - "traefik.http.routers.jellyseerr-stable-insecure.rule=Host(`seerr.home.arpa`)"
      - "traefik.http.routers.jellyseerr-stable-insecure.entrypoints=web"
      - traefik.http.services.jellyseerr-stable.loadbalancer.server.port=5055
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3


networks:
  traefik-net:
    external: true
    name: traefik-net


