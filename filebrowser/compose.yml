
services:
  quantum-filebrowser:
    image: gtstef/filebrowser:2.0.2-stable
    container_name: quantum-filebrowser
    user: ${UID}:${GID}
    environment:
      - FILEBROWSER_ADMIN_PASSWORD=${FILEBROWSER_ADMIN_PASSWORD}
    volumes:
      - ~/Public:/folder
      - ./data/quantum-browser:/home/filebrowser/data
    ports:
      - 3487:80
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      # https
      - "traefik.http.routers.file.rule=host(`file.home.arpa`)"
      - "traefik.http.routers.file.entrypoints=websecure"
      - 'traefik.http.routers.file.tls=true'
      - "traefik.http.services.file.loadbalancer.server.port=80"
      # http
      - "traefik.http.routers.file-insecure.rule=host(`file.home.arpa`)"
      - "traefik.http.routers.file-insecure.entrypoints=web"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"] 
      interval: 60s
      timeout: 3s
      start_period: 10s
      retries: 3

