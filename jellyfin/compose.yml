
services:
  jellyfin-stable:
    image: jellyfin/jellyfin:12.4
    container_name: jellyfin-stable
    # cpu_shares: 2048         # High CPU processing priority when host is busy
    # oom_score_adj: -500      # High survival priority; kill other containers before this one
    # 2. Prevent Disk Swapping completely
    mem_limit: 2G            # Standard memory ceiling
    memswap_limit: 2G        # Equal to mem_limit means exactly ZERO swap space allowed
    # 3. Lock memory pages into physical hardware RAM chips
    ulimits:
      memlock:
        soft: -1
        hard: -1
    user: ${UID}:${GID}
    environment:
      - JELLYFIN_PublishedServerUrl=${DUCK_JELLYFIN_URL}
    networks:
      - traefik-net
    volumes:
      - ./data/jellyfin-stable/config:/config
      - ./data/jellyfin-stable/cache:/cache
      - ~/Public/Media:/media
      - /etc/localtime:/etc/localtime:ro
      # custom
      - ./data/custom:/jellyfin/jellyfin-web/custom:ro
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
      - 7359:7359/udp
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # https
      - "traefik.http.routers.jellyfin.rule=Host(`${DUCK_BASE}`) && PathPrefix(`/movie`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - 'traefik.http.routers.jellyfin.tls=true'
      - "traefik.http.routers.jellyfin.tls.certresolver=myresolver"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      # http
      - "traefik.http.routers.jellyfin-insecure.rule=Host(`${DUCK_BASE}`) && PathPrefix(`/movie`)"
      - "traefik.http.routers.jellyfin-insecure.entrypoints=web"
      # dynacat
      - "dynacat.name=Jellyfin"
      - "dynacat.icon=sh:jellyfin"
      - "dynacat.url=https://${DUCK_BASE}/movie"
      - "dynacat.description=Movies & Series"
      - "dynacat.category=primary"
      - "dynacat.id=jellyfin"
      - "dynacat.hide=false"
      - "dynacat.same-tab=true"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s


networks:
  traefik-net:
    external: true
    name: traefik-net


