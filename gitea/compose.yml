
services:
  gitea:
    image: gitea/gitea:28.2.0
    container_name: gitea
    networks:
      - traefik-net
    environment:
      - USER_UID=${UID}
      - USER_GID=${GID}
      - GITEA__webhook__ALLOWED_HOST_LIST=192.168.0.120
      - GITEA__webhook__SKIP_TLS_VERIFY=true
    restart: always
    volumes:
      - ./data/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3442:3000"
      # - "222:22"
    labels:
      - "traefik.enable=true"
      # https
      - "traefik.http.routers.gitea.rule=Host(`gitea.home.arpa`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - 'traefik.http.routers.gitea.tls=true'
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
      # http
      - "traefik.http.routers.gitea-insecure.rule=Host(`gitea.home.arpa`)"
      - "traefik.http.routers.gitea-insecure.entrypoints=web"
      # dynacat
      - "dynacat.name=Giea"
      - "dynacat.icon=sh:gitea"
      - "dynacat.url=https://gitea.home.arpa"
      - "dynacat.description=Local Git"
      - "dynacat.category=tools"
      - "dynacat.id=gitea"
      - "dynacat.hide=false"
      - "dynacat.same-tab=true"


networks:
  traefik-net:
    external: true
    name: traefik-net

