
services:
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:2.3.1
    container_name: profilarr
    restart: unless-stopped
    networks:
      - traefik-net
    ports:
      - 6868:6868
    volumes:
      - ./data/profilarr:/config
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=${TZ}
    labels:
      - "traefik.enable=true"
      # https
      - "traefik.http.routers.profilarr.rule=host(`profilarr.home.arpa`)"
      - "traefik.http.routers.profilarr.entrypoints=websecure"
      - 'traefik.http.routers.profilarr.tls=true'
      - "traefik.http.services.profilarr.loadbalancer.server.port=6868"
      # http
      - "traefik.http.routers.profilarr-insecure.rule=host(`profilarr.home.arpa`)"
      - "traefik.http.routers.profilarr-insecure.entrypoints=web"


networks:
  traefik-net:
    external: true
    name: traefik-net


