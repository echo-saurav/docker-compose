---
services:
  it-tools:
    image: corentinth/it-tools:2024.10.22-7ca5933
    container_name: it-tools
    restart: unless-stopped
    networks:
      - traefik-net
    ports:
      - 4892:80
    labels:
      - "traefik.enable=true"
      # https
      - "traefik.http.routers.it-tools.rule=Host(`tools.home.arpa`)"
      - "traefik.http.routers.it-tools.entrypoints=websecure"
      - 'traefik.http.routers.it-tools.tls=true'
      - "traefik.http.services.it-tools.loadbalancer.server.port=80"
      # http
      - "traefik.http.routers.it-tools-insecure.rule=Host(`tools.home.arpa`)"
      - "traefik.http.routers.it-tools-insecure.entrypoints=web"
      # dynacat
      - "dynacat.name=It Tools"
      - "dynacat.icon=sh:it-tools"
      - "dynacat.url=https://tools.home.arpa"
      - "dynacat.description=tools"
      - "dynacat.category=tools"
      - "dynacat.id=it-tools"
      - "dynacat.hide=false"
      - "dynacat.same-tab=true"


  omni-tools:
    image: iib0011/omni-tools:0.7.0
    container_name: omni-tools
    restart: unless-stopped
    ports:
      - 8398:80
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      # https
      - "traefik.http.routers.omni-tools.rule=Host(`omnitools.home.arpa`)"
      - "traefik.http.routers.omni-tools.entrypoints=websecure"
      - 'traefik.http.routers.omni-tools.tls=true'
      - "traefik.http.services.omni-tools.loadbalancer.server.port=80"
      # http
      - "traefik.http.routers.omni-tools-insecure.rule=Host(`omnitools.home.arpa`)"
      - "traefik.http.routers.omni-tools-insecure.entrypoints=web"
      # dynacat
      - "dynacat.name=Omnitools"
      - "dynacat.icon=sh:omnitools"
      - "dynacat.url=https://omnitools.home.arpa"
      - "dynacat.description=tools"
      - "dynacat.category=tools"
      - "dynacat.id=omni-tools"
      - "dynacat.hide=false"
      - "dynacat.same-tab=true"


networks:
  traefik-net:
    external: true
    name: traefik-net
