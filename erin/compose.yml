
services:
  erin:
    container_name: erin
    image: ghcr.io/echo-saurav/erin:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - 6969:4232
    volumes:
      - ~/Public/Others/Stash/:/srv/videos:ro
    environment:
      PUBLIC_URL: ":4232"
      APP_TITLE: "erin"
      AUTH_SECRET: $AUTH_SECRET
      VIDEO_START_POSITION: "random"
      USE_CUSTOM_SKIN: "false"
      PROGRESS_BAR_POSITION: "bottom"
      AUTH_ENABLED: "false"
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"  
      # https
      - "traefik.http.routers.erin.rule=host(`erin.home.arpa`)"
      - "traefik.http.routers.erin.entrypoints=websecure"
      - 'traefik.http.routers.erin.tls=true'
      - "traefik.http.services.erin.loadbalancer.server.port=4232"
      # http
      - "traefik.http.routers.erin-insecure.rule=host(`erin.home.arpa`)"
      - "traefik.http.routers.erin-insecure.entrypoints=web"

networks:
  traefik-net:
    external: true
    name: traefik-net








