
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    container_name: sonarr
    networks:
      - traefik-net
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=${TZ}
    volumes: 
      - ~/Public/Media:/data
      - ./data/sonarr:/config
    ports:
      - 8092:8989
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # https
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.home.arpa`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - 'traefik.http.routers.sonarr.tls=true'
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      # http
      - "traefik.http.routers.sonarr-insecure.rule=Host(`sonarr.home.arpa`)"
      - "traefik.http.routers.sonarr-insecure.entrypoints=web"
      # dynacat
      - "dynacat.name=Sonarr"
      - "dynacat.icon=sh:sonarr"
      - "dynacat.url=https://sonarr.home.arpa"
      - "dynacat.description=Series arr"
      - "dynacat.category=arr"
      - "dynacat.id=sonarr"
      - "dynacat.hide=false"
      - "dynacat.same-tab=true"


networks:
  traefik-net:
    external: true
    name: traefik-net


