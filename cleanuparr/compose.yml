
services:
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:2.10.12
    container_name: cleanuparr
    restart: unless-stopped
    networks:
      - traefik-net
    ports:
      - 11011:11011
    volumes:
      - ./data/cleanuparr:/config
    environment:
      - PORT=11011
      - PUID=${UID}
      - PGID=${GID}
      - UMASK=022
      - TZ=${TZ}
      # - BASE_PATH=
    labels:
      - "traefik.enable=true"
      # https
      - "traefik.http.routers.clean.rule=Host(`clean.home.arpa`)"
      - "traefik.http.routers.clean.entrypoints=websecure"
      - 'traefik.http.routers.clean.tls=true'
      - "traefik.http.services.clean.loadbalancer.server.port=11011"
      # http
      - "traefik.http.routers.clean-insecure.rule=Host(`clean.home.arpa`)"
      - "traefik.http.routers.clean-insecure.entrypoints=web"
      # dynacat
      - "dynacat.name=Cleanuparr"
      - "dynacat.icon=sh:cleanuparr"
      - "dynacat.url=http://clean.home.arpa"
      - "dynacat.description=clean arrs"
      - "dynacat.category=arr"
      - "dynacat.id=cleanuparr"
      - "dynacat.hide=false"
      - "dynacat.same-tab=true"

networks:
  traefik-net:
    external: true
    name: traefik-net


